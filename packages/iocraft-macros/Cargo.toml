[package]
name = "iocraft-macros"
version = "0.2.5"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Macro implementations for the iocraft crate."
repository = "https://github.com/ccbrown/iocraft"

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1.0.86"
quote = "1.0.37"
syn = { version = "3.0.9", features = ["full", "visit", "visit-mut"] }

[dev-dependencies]
iocraft = { path = "../iocraft" }
smol = "2.0.1"
unicode-width = "0.2.2"
serde_json = "1.0"
tempfile = "3"
