[package]
name = "iocraft"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Create beautifully crafted CLI programs and text output with a declarative React-like Rust API."
repository = "https://github.com/ccbrown/iocraft"

[features]
default = []
unstable-output-streams = []
# Enables Serde serialization and deserialization of crossterm types such as `Color` and `KeyCode`.
serde = ["crossterm/serde"]

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.30"
taffy = { version = "0.15.0", default-features = false, features = ["std", "flexbox", "grid", "parse", "taffy_tree"] }
iocraft-macros = { version = "0.2.5", path = "../iocraft-macros" }
# CC Ink renders every color through chalk; the canvas SGR encoders take
# chalk's level detection and downgrade math from the same port.
chalk = { version = "0.2.0", path = "../chalk" }
bitflags = "2.6.0"
unicode-width = "0.2.2"
unicode-segmentation = "1"
unicode-bidi = "0.3.18"
generational-box = "0.7.10"
regex = "1.12.3"
# Runtime-agnostic timer used for render-loop frame throttling.
futures-timer = "3"

[target.'cfg(unix)'.dependencies]
# Already present in crossterm's unix dependency tree; used directly for
# SIGCONT-based self-healing redraws after Ctrl+Z suspend/resume.
signal-hook = "0.3"

[dev-dependencies]
avt = "0.18"
serde_json = "1.0"
indoc = "2"
smol = "2.0.1"
smol-macros = "0.1.1"
macro_rules_attribute = "0.2.0"
# XXX: Enables optional features when testing so CI covers them. This has no
# version, so Cargo strips it when publishing.
iocraft = { path = ".", features = ["serde"] }
